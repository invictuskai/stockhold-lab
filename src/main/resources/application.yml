spring:
  application:
    name: stockhold-lab
  datasource:
    # 会话固定 UTC、READ COMMITTED；锁等待 1 秒是实验值（总体技术方案第 10 节）。
    url: ${STOCKHOLD_DB_URL:jdbc:mysql://127.0.0.1:33306/stockhold?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sessionVariables=transaction_isolation='READ-COMMITTED',innodb_lock_wait_timeout=1&rewriteBatchedStatements=true&characterEncoding=UTF-8}
    username: ${STOCKHOLD_DB_USER:stockhold}
    password: ${STOCKHOLD_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${STOCKHOLD_DB_POOL_SIZE:16}
      minimum-idle: ${STOCKHOLD_DB_POOL_SIZE:16}
      connection-timeout: 2000
      pool-name: stockhold
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移账号与业务账号分离时，同时设置 SPRING_FLYWAY_URL / SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD；
    # 未设置时沿用业务数据源。
  jackson:
    deserialization:
      # 数量与 ID 必须是整数：拒绝小数截断和字符串强转。
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  servlet:
    multipart:
      enabled: false

server:
  # 默认只监听本地。
  address: ${STOCKHOLD_SERVER_ADDRESS:127.0.0.1}
  port: ${STOCKHOLD_SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
    threads:
      max: ${STOCKHOLD_HTTP_THREADS:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles:
        stockhold.operation: 0.5,0.95,0.99
        stockhold.transaction: 0.5,0.95,0.99
        stockhold.connection.acquire: 0.5,0.95,0.99
        stockhold.connection.hold: 0.5,0.95,0.99
        stockhold.sql: 0.5,0.95,0.99

stockhold:
  reserve:
    max-attempts: 5
    budget-millis: 2000
    jitter-min-millis: 50
    jitter-max-millis: 150
    max-concurrent: 64
    admission-wait-millis: 200
    # 第二阶段候选优化：多维度预留用 UNION ALL 一次锁定；默认逐维度 SELECT。
    union-all-select: ${STOCKHOLD_UNION_ALL_SELECT:false}
  transaction:
    timeout-seconds: 5
    transient-retries: 3
  refill:
    insert-batch-size: 100
    job-enabled: true
    scan-page-size: 200
    workers: 2
    low-watermark-percent: 25
  expiry:
    job-enabled: true
    batch-size: 200
  admin:
    # 管理接口默认关闭；dev profile 开启并要求 STOCKHOLD_ADMIN_TOKEN。
    enabled: false
    token: ${STOCKHOLD_ADMIN_TOKEN:}
