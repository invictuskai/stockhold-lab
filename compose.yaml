# 本地实验用 MySQL 8.4 LTS。端口只绑定 127.0.0.1；凭据来自 .env（参见 .env.example），不提交真实值。
services:
  mysql:
    image: mysql:8.4
    command:
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
      - --innodb-lock-wait-timeout=1
      - --max-connections=300
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # GTID 复制：供可选的只读副本（replica profile）按 GTID 自动定位。
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${STOCKHOLD_DB_ROOT_PASSWORD:?set STOCKHOLD_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: stockhold
      MYSQL_USER: ${STOCKHOLD_DB_USER:-stockhold}
      MYSQL_PASSWORD: ${STOCKHOLD_DB_PASSWORD:?set STOCKHOLD_DB_PASSWORD in .env}
      # 可选：锁形态测试使用的只读观察账号（见 scripts/mysql-init/01-test-db.sh）。
      STOCKHOLD_TEST_OBSERVER_USER: ${STOCKHOLD_TEST_OBSERVER_USER:-stockhold_observer}
      STOCKHOLD_TEST_OBSERVER_PASSWORD: ${STOCKHOLD_TEST_OBSERVER_PASSWORD:-}
    ports:
      - "127.0.0.1:${STOCKHOLD_DB_PORT:-33306}:3306"
    volumes:
      - ./.mysql-data/compose:/var/lib/mysql
      - ./scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # docker compose --profile replica up -d && scripts/replica-setup.sh：只读副本（文章：部分读流量移到副本）。
  # 首次初始化后由脚本用带 GTID 的逻辑备份装载并开始复制，再开启 super_read_only。
  mysql-replica:
    image: mysql:8.4
    profiles: [replica]
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --server-id=2
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --relay-log=relay-bin
      # 只读副本常用的取舍：放宽刷盘、多线程并行应用。实测默认（每事务两次 fsync、4 个应用线程）
      # 在与主库同一虚拟机时跟不上约 1,700 事务/秒的写入，落后可达十余分钟。
      - --innodb-flush-log-at-trx-commit=2
      - --sync-binlog=0
      - --replica-parallel-workers=8
    environment:
      MYSQL_ROOT_PASSWORD: ${STOCKHOLD_DB_ROOT_PASSWORD:?set STOCKHOLD_DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${STOCKHOLD_REPLICA_DB_PORT:-33307}:3306"
    volumes:
      - ./.mysql-data/replica:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  # docker compose --profile migration up -d：旧 Redis 预留系统，供影子迁移实验（migration profile）使用。
  redis:
    image: redis:7.4
    profiles: [migration]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${STOCKHOLD_REDIS_PORT:-36379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # docker compose --profile proxysql up -d：在应用与 MySQL 之间加 ProxySQL，按 SQL 注释中的 conn_tag 归因。
  # 配置由模板渲染，凭据来自 .env；管理端口不发布到宿主机，经由 compose 网络访问。
  proxysql:
    image: proxysql/proxysql:2.7.3
    profiles: [proxysql]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      STOCKHOLD_DB_USER: ${STOCKHOLD_DB_USER:-stockhold}
      STOCKHOLD_DB_PASSWORD: ${STOCKHOLD_DB_PASSWORD:?set STOCKHOLD_DB_PASSWORD in .env}
      STOCKHOLD_PROXYSQL_ADMIN_PASSWORD: ${STOCKHOLD_PROXYSQL_ADMIN_PASSWORD:-${STOCKHOLD_DB_PASSWORD}}
    entrypoint:
      - sh
      - -c
      - >-
        sed -e "s|__DB_USER__|$$STOCKHOLD_DB_USER|g"
        -e "s|__DB_PASSWORD__|$$STOCKHOLD_DB_PASSWORD|g"
        -e "s|__ADMIN_PASSWORD__|$$STOCKHOLD_PROXYSQL_ADMIN_PASSWORD|g"
        /etc/stockhold/proxysql.cnf.template > /tmp/proxysql.cnf
        && exec proxysql -f --initial -c /tmp/proxysql.cnf
    ulimits:
      nofile: {soft: 65535, hard: 65535}
    volumes:
      - ./scripts/proxysql:/etc/stockhold:ro
    ports:
      - "127.0.0.1:${STOCKHOLD_PROXYSQL_PORT:-36033}:6033"
